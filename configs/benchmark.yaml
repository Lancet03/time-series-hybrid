name: Common full benchmark
purpose: benchmark
protocol: common
context: 336
horizons:
- 48
- 96
device: auto
threads: 4
output: ../outputs
cache: ../.cache/huggingface
model_lock: model-lock.json
evaluation:
  batch_size: 16
  val_stride: 1
  test_stride: 1
datasets:
- name: ETTm1
  path: ../data/ETTm1.npy
  seasonality: 96
  frequency: 15min
  split:
  - 0.6
  - 0.2
  - 0.2
  take_n: 57600
- name: Weather
  path: ../data/weather.npy
  seasonality: 144
  frequency: 10min
  split:
  - 0.7
  - 0.1
  - 0.2
- name: ECL
  path: ../data/electricity.npy
  seasonality: 24
  frequency: 1h
  split:
  - 0.7
  - 0.1
  - 0.2
models:
- id: ar
  type: ar
  params:
    fit_prefix: 128
  candidates:
  - order: 16
  - order: 32
- id: arima
  type: arima
  params:
    fit_prefix: 128
    maxiter: 100
  candidates:
  - order:
    - 2
    - 1
    - 0
  - order:
    - 2
    - 0
    - 0
- id: dlinear
  type: dlinear
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  params:
    epochs: 50
    batch_size: 64
    lr: 0.0001
    revin: true
- id: tsmixer
  type: tsmixer
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  params:
    epochs: 25
    batch_size: 64
    lr: 0.0001
    model_params:
      d_hidden_temporal: 128
      d_hidden_channel: 24
- id: moderntcn
  type: moderntcn
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  params:
    epochs: 15
    batch_size: 64
    lr: 0.0001
    model_params:
      d_hidden: 256
- id: patchtst
  type: patchtst
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  params:
    epochs: 10
    batch_size: 64
    lr: 0.0002
    model_params:
      d_hidden: 32
- id: itransformer
  type: itransformer
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  params:
    epochs: 25
    batch_size: 64
    lr: 0.0002
    model_params:
      d_hidden: 256
- id: chronos
  type: chronos
  params:
    checkpoint: amazon/chronos-bolt-tiny
    revision: main
    batch_size: 16
- id: timesfm
  type: timesfm
  params:
    checkpoint: google/timesfm-2.5-200m-pytorch
    revision: main
    batch_size: 8
- id: moirai
  type: moirai
  params:
    checkpoint: Salesforce/moirai-1.1-R-small
    revision: main
    batch_size: 8
    num_samples: 100
    patch_size: 32
- id: arima_chronos
  type: hybrid
  base: arima
  residual: chronos
  params:
    warmup: 128
- id: arima_timesfm
  type: hybrid
  base: arima
  residual: timesfm
  params:
    warmup: 128
- id: arima_moirai_base
  type: arima
  params:
    fit_prefix: 128
    maxiter: 100
    initialization: approximate_diffuse
  candidates:
  - order: [2, 1, 0]
  - order: [2, 0, 0]
- id: arima_moirai
  type: hybrid
  base: arima_moirai_base
  residual: moirai
  params:
    warmup: 128
