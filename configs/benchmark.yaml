name: Common full benchmark
purpose: benchmark
protocol: common
context: 336
horizons:
- 48
- 96
device: auto
threads: 4
output: ../outputs
cache: ../.cache/huggingface
model_lock: model-lock.json
references: ../references/hn_mvts_author.csv
evaluation:
  batch_size: 16
  val_stride: 1
  test_stride: 1
datasets:
- name: ETTm1
  path: ../data/ETTm1.npy
  seasonality: 96
  frequency: 15min
  split:
  - 0.6
  - 0.2
  - 0.2
  take_n: 57600
- name: Weather
  path: ../data/weather.npy
  seasonality: 144
  frequency: 10min
  split:
  - 0.7
  - 0.1
  - 0.2
- name: ECL
  path: ../data/electricity.npy
  seasonality: 24
  frequency: 1h
  split:
  - 0.7
  - 0.1
  - 0.2
models:
- id: last_value
  type: last_value
- id: seasonal_naive
  type: seasonal_naive
- id: ar
  type: ar
  params:
    fit_prefix: 128
  candidates:
  - order: 16
  - order: 32
- id: arima
  type: arima
  params:
    fit_prefix: 128
    maxiter: 100
  candidates:
  - order:
    - 2
    - 1
    - 0
  - order:
    - 2
    - 0
    - 0
- id: ets
  type: ets
  params:
    trend: add
- id: dlinear
  type: dlinear
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  params:
    epochs: 50
    batch_size: 64
    lr: 0.0001
    revin: true
- id: chronos
  type: chronos
  params:
    checkpoint: amazon/chronos-bolt-tiny
    revision: main
    batch_size: 16
- id: timesfm
  type: timesfm
  params:
    checkpoint: google/timesfm-2.5-200m-pytorch
    revision: main
    batch_size: 8
- id: moirai
  type: moirai
  params:
    checkpoint: Salesforce/moirai-1.1-R-small
    revision: main
    batch_size: 8
    num_samples: 100
    patch_size: 32
- id: arima_chronos
  type: hybrid
  base: arima
  residual: chronos
  params:
    warmup: 128
