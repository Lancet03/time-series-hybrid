name: Local neural baselines on ETTm1
purpose: benchmark
protocol: common
context: 336
horizons: [48, 96]
device: auto
threads: 4
output: ../outputs

evaluation:
  batch_size: 64
  val_stride: 1
  test_stride: 1

datasets:
- name: ETTm1
  path: ../data/ETTm1.npy
  seasonality: 96
  frequency: 15min
  split: [0.6, 0.2, 0.2]
  take_n: 57600

# Local implementations of the reference Base architectures. This is a common-protocol
# comparison, not a claim to reproduce a paper table. Training settings follow
# local author YAMLs (DLinear lr follows the previously reproduced author log).
models:
- id: dlinear
  type: dlinear
  seeds: [0]
  params:
    epochs: 50
    batch_size: 64
    lr: 0.0001
    revin: true
- id: tsmixer
  type: tsmixer
  seeds: [0]
  params:
    epochs: 25
    batch_size: 64
    lr: 0.0001
    model_params:
      d_hidden_temporal: 128
      d_hidden_channel: 24
- id: moderntcn
  type: moderntcn
  seeds: [0]
  params:
    epochs: 15
    batch_size: 64
    lr: 0.0001
    model_params:
      d_hidden: 256
- id: patchtst
  type: patchtst
  seeds: [0]
  params:
    epochs: 10
    batch_size: 64
    lr: 0.0002
    model_params:
      d_hidden: 32
- id: itransformer
  type: itransformer
  seeds: [0]
  params:
    epochs: 25
    batch_size: 64
    lr: 0.0002
    model_params:
      d_hidden: 256
