[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-hybrid"
version = "0.1.0"
description = "Reproducible statistical, neural and foundation-model forecasting experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "pyarrow>=15", "PyYAML>=6", "scipy>=1.11", "statsmodels>=0.14,<0.15", "torch>=2.2", "huggingface-hub>=0.26,<2", "psutil>=5.9", "joblib>=1.4,<2"]

[project.optional-dependencies]
chronos = ["chronos-forecasting==2.3.2", "transformers>=4.41,<5", "accelerate>=1.1,<2"]
timesfm = ["timesfm[torch]==3.0.2"]
moirai = ["uni2ts==2.0.0", "pyarrow>=15,<20"]
plots = ["matplotlib>=3.8"]
network = ["truststore>=0.10"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
tsh = "tshybrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E9", "F"]
