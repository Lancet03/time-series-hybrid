name: 'Step 5: ARIMA + Moirai (expanded pilot)'
purpose: pilot
protocol: common
context: 336
horizons:
- 48
- 96
device: auto
threads: 4
output: ../outputs
cache: ../.cache/huggingface
model_lock: model-lock.json
evaluation:
  batch_size: 8
  val_limit: 16
  test_limit: 16
  val_stride: 1
  test_stride: 1
datasets:
- name: ETTm1
  path: ../data/ETTm1.npy
  seasonality: 96
  frequency: 15min
  split:
  - 0.6
  - 0.2
  - 0.2
  take_n: 57600
- name: Weather
  path: ../data/weather.npy
  seasonality: 144
  frequency: 10min
  split:
  - 0.7
  - 0.1
  - 0.2
- name: ECL
  path: ../data/electricity.npy
  seasonality: 24
  frequency: 1h
  split:
  - 0.7
  - 0.1
  - 0.2
  channels:
  - 0
  - 21
  - 42
  - 64
  - 85
  - 106
  - 128
  - 149
  - 170
  - 192
  - 213
  - 234
  - 256
  - 277
  - 298
  - 320
models:
- id: arima_moirai_base
  type: arima
  params:
    fit_prefix: 128
    maxiter: 100
    initialization: approximate_diffuse
  candidates:
  - order:
    - 2
    - 1
    - 0
  - order:
    - 2
    - 0
    - 0
- id: moirai
  type: moirai
  params:
    checkpoint: Salesforce/moirai-1.1-R-small
    revision: 0c24ab99db2c1a70ea2a0fc03bf113329772ac64
    batch_size: 8
    num_samples: 100
    patch_size: 32
- id: arima_moirai
  type: hybrid
  base: arima_moirai_base
  residual: moirai
  params:
    warmup: 128
